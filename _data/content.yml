### About [ about ]
about:
  title: "About Me"
  subtitle: "whoami"
  text: "<p>I studied programming, then spent years as a system administrator and as a freelance web, graphic and 3D designer. Setting up servers, networks and software and fixing things when they break was always the part I liked most, so in 2021 I moved into DevOps.</p><p>Today I automate infrastructure with Terraform and Ansible, run containers in Docker and Kubernetes, build CI/CD pipelines and keep an eye on everything with Prometheus and Grafana. Because of my health I work remotely only.</p>"

# Theme Settings Configuration File
##
### use settings.yml file for configure colors, ui, rtl, sidebar, animation options

### Main Settings
settings:
  quick_colors: "terminal" # select quick color schemes: "beige", "blue", "brown", "green_light", "green", "orange", "purple", "red", "yellow_light", "yellow". If empty colors taken from _sass/ryancv/settings.scss

### Header
header:
  logo:
    text: "~/kostanproff<span class=\"logo-prompt\">$</span>"
    alt: "Konstantin Kozulko"

  button:
    text: "cv.pdf ↓"
    url: "assets/cv/Konstantin-Kozulko-DevOps-CV.pdf"
    icon: "fas fa-download"

### Portfolio Filters Settings
portfolio:
